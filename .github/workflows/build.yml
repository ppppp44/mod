name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auto-patch 26.3 API renames
        run: |
          python3 -c '
          import pathlib, re
          for p in pathlib.Path("src").rglob("*.java"):
              txt = p.read_text()
              txt = txt.replace(".dimension().location()", ".dimension().identifier()")
              txt = txt.replace("mob.moveTo(", "mob.snapTo(")
              txt = re.sub(r"player\.displayClientMessage\((.+?),\s*true\s*\);", r"player.sendSystemMessage(\1);", txt, flags=re.DOTALL)
              p.write_text(txt)
          '
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build with Gradle
        run: gradle build
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/*.jar
