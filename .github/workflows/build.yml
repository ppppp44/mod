name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auto-patch 26.3 API renames, Villager AI, and Downward Staircase Mining
        run: |
          python3 -c '
          import pathlib, re
          for p in pathlib.Path("src").rglob("*.java"):
              txt = p.read_text()
              txt = txt.replace(".dimension().location()", ".dimension().identifier()")
              txt = txt.replace("mob.moveTo(", "mob.snapTo(")
              txt = re.sub(r"player\.displayClientMessage\((.+?),\s*true\s*\);", r"player.sendSystemMessage(\1);", txt, flags=re.DOTALL)
              txt = txt.replace(
                  "held.is(ItemTags.PICKAXES)",
                  "(held.is(ItemTags.PICKAXES) || held.getItem().toString().toLowerCase().contains(\"pickaxe\"))"
              )
              txt = txt.replace(
                  "tool.is(ItemTags.PICKAXES)",
                  "(tool.is(ItemTags.PICKAXES) || tool.getItem().toString().toLowerCase().contains(\"pickaxe\"))"
              )
              if p.name == "MobMineBlockGoal.java":
                  txt = txt.replace(
                      "for (int dy = 0; dy < VERTICAL_SCAN; dy++) {",
                      "for (int dy = -1; dy < VERTICAL_SCAN; dy++) {"
                  )
                  txt = txt.replace(
                      "if (pos.getY() < feet.getY()",
                      "if (pos.getY() < feet.getY() - 1 || (pos.getY() < feet.getY() && (!level.getBlockState(pos.below()).getFluidState().isEmpty() || level.getBlockState(pos.below()).isAir()))"
                  )
                  txt = txt.replace(
                      "tool.hurtAndBreak(1, mob, EquipmentSlot.MAINHAND);",
                      "// unbreakable worker tool"
                  )
              if p.name == "ModEvents.java":
                  txt = txt.replace(
                      "OverseerWandItem.bind(held, serverLevel, clickedPos);",
                      "OverseerWandItem.bind(held, serverLevel, clickedPos);\n                player.setItemInHand(InteractionHand.MAIN_HAND, held);"
                  )
                  txt = txt.replace(
                      "mob.setPersistenceRequired();",
                      "mob.setPersistenceRequired();\n            mob.setCanPickUpLoot(false);"
                  )
                  txt = txt.replace(
                      "import net.fabricmc.fabric.api.event.lifecycle.v1.ServerEntityEvents;",
                      "import net.fabricmc.fabric.api.event.lifecycle.v1.ServerEntityEvents;\nimport net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;\nimport java.util.WeakHashMap;\nimport java.util.Map;"
                  )
                  txt = txt.replace(
                      ".addGoal(2, new MobMineBlockGoal(mob));",
                      ".addGoal(0, new MobMineBlockGoal(mob));"
                  )
                  villager_tick = """
                  Map<Villager, MobMineBlockGoal> villagerGoals = new WeakHashMap<>();
                  ServerTickEvents.END_LEVEL_TICK.register(world -> {
                      for (Entity e : world.getAllEntities()) {
                          if (e instanceof Villager v && !v.isRemoved()) {
                              MobMineBlockGoal g = villagerGoals.computeIfAbsent(v, MobMineBlockGoal::new);
                              if (g.canContinueToUse() || g.canUse()) {
                                  g.tick();
                              }
                          }
                      }
                  });
                  """
                  txt = txt.replace(
                      "MobMiners.LOGGER.info(\"MobMiners event handlers registered\");",
                      villager_tick + "\n        MobMiners.LOGGER.info(\"MobMiners event handlers registered\");"
                  )
              p.write_text(txt)
          '
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build with Gradle
        run: gradle build
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/*.jar
